<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cedarville - Men's Tennis Schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../kpi-style.css">
</head>
<body>
<div class="masthead">
  <div class="masthead-inner">
    <p class="eyebrow"><span class="dot"></span>DIVISION 3 &middot; 2026 SEASON</p>
    <h1>Cedarville</h1>
    <div class="masthead-meta">
      <span>4-1 &middot; Rank #38 &middot; Rating +0.86</span>
      <a href="../2026mtenD3.html">&larr; Back to rankings</a>
    </div>
  </div>
</div>
<div class="yardline" aria-hidden="true"></div>

<div class="page">
  
  <div class="table-card">
    <div class="table-scroll">
      <table class="schedule">
        <thead><tr><th>Date</th><th>Opponent</th><th>Rank</th><th>Result</th></tr></thead>
        <tbody><tr><td>Sep 22</td><td class="team"><a href="2026mtenD3-otterbein.html">Otterbein</a></td><td class="rank">#138</td><td class="wl"><b class="w">W</b> 7&ndash;0</td></tr><tr><td>Oct 04</td><td class="team"><a href="2026mtenD3-grove-city.html">Grove City</a></td><td class="rank">#147</td><td class="wl"><b class="w">W</b> 7&ndash;0</td></tr><tr><td>Mar 02</td><td class="team"><a href="2026mtenD3-trine.html">Trine</a></td><td class="rank">#122</td><td class="wl"><b class="w">W</b> 4&ndash;2</td></tr><tr><td>Mar 03</td><td class="team"><a href="2026mtenD3-rose-hulman.html">Rose-Hulman</a></td><td class="rank">#87</td><td class="wl"><b class="w">W</b> 6&ndash;1</td></tr><tr><td>Mar 04</td><td class="team"><a href="2026mtenD3-mary-washington.html">Mary Washington</a></td><td class="rank">#10</td><td class="wl"><b class="l">L</b> 1&ndash;6</td></tr></tbody>
      </table>
    </div>
  </div>

  
</div>
<script>
(function(){
  var card = document.querySelector(".chart-card");
  if(!card) return;
  var dots = card.querySelectorAll(".chart-dot");
  if(!dots.length) return;

  var tooltip = document.createElement("div");
  tooltip.className = "chart-tooltip";
  card.appendChild(tooltip);

  function position(dot){
    var dotBox = dot.getBoundingClientRect();
    var cardBox = card.getBoundingClientRect();
    var tipBox = tooltip.getBoundingClientRect();
    var halfWidth = tipBox.width / 2;
    var x = dotBox.left - cardBox.left + dotBox.width / 2;
    x = Math.max(halfWidth + 4, Math.min(cardBox.width - halfWidth - 4, x));
    tooltip.style.left = x + "px";
    tooltip.style.top = (dotBox.top - cardBox.top) + "px";
  }

  dots.forEach(function(dot){
    dot.addEventListener("mouseenter", function(){
      dot.setAttribute("r", 6);
      var result = dot.dataset.result;
      var resultHtml = (result === "W" || result === "L")
        ? '<b class="' + result.toLowerCase() + '">' + result + "</b>"
        : result;
      tooltip.innerHTML = '<div class="tt-date">' + dot.dataset.date + '</div><div>'
        + resultHtml + " " + dot.dataset.score + " vs " + dot.dataset.opp + "</div>";
      position(dot);
      tooltip.classList.add("visible");
    });
    dot.addEventListener("mouseleave", function(){
      dot.setAttribute("r", 4);
      tooltip.classList.remove("visible");
    });
  });
})();
</script>
</body>
</html>
